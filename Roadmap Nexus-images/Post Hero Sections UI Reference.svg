  <!-- Why teams switch -->
  <g transform="translate(160 1220)">
    <text x="0" y="0" class="small">• WHY TEAMS SWITCH</text>
    <text x="0" y="80" class="h1">Stop renting the product ops layer.</text>
    <text x="770" y="36" class="body">Roadmaps, changelogs, and feedback are customer trust surfaces. Keep them inside your own stack instead of spreading product context across rented dashboards.</text>
    <g transform="translate(0 160)">
      <rect width="1280" height="440" class="soft"/>
      <line x1="640" y1="0" x2="640" y2="440" class="rule"/>
      <text x="56" y="64" class="small">HOSTED ROADMAP TOOLS</text>
      <text x="56" y="130" class="h2">Subscription sprawl</text>
      <text x="56" y="180" class="body">Separate tools, separate billing, fragmented customer context.</text>
      <text x="56" y="270" class="muted">✕ Per-seat pricing</text>
      <text x="56" y="315" class="muted">✕ Locked product data</text>
      <text x="56" y="360" class="muted">✕ Hard to customize</text>
      <text x="696" y="64" class="small" fill="#16A34A">ROADMAP NEXUS</text>
      <text x="696" y="130" class="h2">Own the surface</text>
      <text x="696" y="180" class="body">One self-hosted starter for roadmap, releases, and feedback.</text>
      <text x="696" y="270" class="muted">✓ MIT licensed core</text>
      <text x="696" y="315" class="muted">✓ Your server, your data</text>
      <text x="696" y="360" class="muted">✓ Built with your stack</text>
    </g>
  </g>

  <!-- Product preview -->
