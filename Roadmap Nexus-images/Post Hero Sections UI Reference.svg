    <text x="0" y="0" class="small">• PRODUCT PREVIEW</text>
    <text x="0" y="80" class="h1">Real surfaces, not placeholders</text>
    <text x="0" y="126" class="body">Roadmap, changelog, and feedback views your team can brand and ship.</text>
    <g transform="translate(0 210)">
      <rect width="1280" height="520" class="soft"/>
      <line x1="426" y1="0" x2="426" y2="520" class="rule"/>
      <line x1="852" y1="0" x2="852" y2="520" class="rule"/>
      <text x="40" y="64" class="h3">Roadmap</text>
      <text x="40" y="98" class="muted">Planned, in-progress, future</text>
      <text x="466" y="64" class="h3">Changelog</text>
      <text x="466" y="98" class="muted">Release history users can read</text>
      <text x="892" y="64" class="h3">Feedback</text>
      <text x="892" y="98" class="muted">Votes, comments, status labels</text>
      <rect x="40" y="150" width="346" height="290" rx="10" class="panel"/>
      <rect x="466" y="150" width="346" height="290" rx="10" class="panel"/>
      <rect x="892" y="150" width="346" height="290" rx="10" class="panel"/>
      <text x="75" y="218" class="label">Public API</text><text x="320" y="218" class="muted">Q2 2024</text>
      <text x="501" y="218" class="label">v1.2.0</text><text x="680" y="218" class="muted">May 12, 2024</text>
      <text x="927" y="218" class="label">Add dark mode</text><text x="1160" y="218" class="muted">23</text>
    </g>
  </g>

