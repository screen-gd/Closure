<svg width="1600" height="3600" viewBox="0 0 1600 3600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M96 0H0V96" stroke="#E8EDF2" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#0B1220" flood-opacity=".08"/>
    </filter>
    <style>
      .h1{font:650 68px Inter,Arial,sans-serif;fill:#07111d;letter-spacing:-2px}
      .h2{font:640 50px Inter,Arial,sans-serif;fill:#07111d;letter-spacing:-1.4px}
      .h3{font:650 25px Inter,Arial,sans-serif;fill:#07111d}
      .body{font:450 20px Inter,Arial,sans-serif;fill:#516173}
      .small{font:650 15px Inter,Arial,sans-serif;fill:#68778a;letter-spacing:3px}
      .label{font:650 17px Inter,Arial,sans-serif;fill:#07111d}
      .muted{font:450 16px Inter,Arial,sans-serif;fill:#66758a}
      .tiny{font:650 13px Inter,Arial,sans-serif;fill:#6b7a8e}
      .rule{stroke:#DDE5EE;stroke-width:1}
      .panel{fill:rgba(255,255,255,.72);stroke:#D7E0EA;stroke-width:1}
      .soft{fill:rgba(255,255,255,.58);stroke:#DCE4ED;stroke-width:1}
    </style>
  </defs>

  <rect width="1600" height="3600" fill="#F8FAFC"/>
  <rect width="1600" height="3600" fill="url(#grid)" opacity=".72"/>
  <circle cx="800" cy="430" r="420" fill="#FFFFFF" opacity=".72"/>
  <circle cx="790" cy="1600" r="520" fill="#FFFFFF" opacity=".62"/>
  <circle cx="800" cy="2950" r="470" fill="#FFFFFF" opacity=".58"/>

  <!-- Bridge rail -->
  <g transform="translate(160 78)">
    <rect x="0" y="0" width="1280" height="126" class="soft"/>
    <line x1="426" y1="0" x2="426" y2="126" class="rule"/>
    <line x1="852" y1="0" x2="852" y2="126" class="rule"/>
    <g transform="translate(40 34)">
      <rect width="54" height="54" rx="16" fill="#EFF6FF"/><path d="M18 20h18M18 27h18M18 34h18" stroke="#237BFF" stroke-width="3" stroke-linecap="round"/>
      <text x="76" y="22" class="h3">Roadmap</text>
      <text x="76" y="50" class="muted">Show what is planned, in progress, and coming next.</text>
      <text x="378" y="35" class="body">→</text>
    </g>
    <g transform="translate(466 34)">
      <rect width="54" height="54" rx="16" fill="#ECFDF3"/><path d="M20 16h14l6 6v16H20V16z" stroke="#22C55E" stroke-width="3" fill="none"/>
      <text x="76" y="22" class="h3">Changelog</text>
      <text x="76" y="50" class="muted">Publish shipped work as a clean public release history.</text>
      <text x="378" y="35" class="body">→</text>
    </g>
    <g transform="translate(892 34)">
      <rect width="54" height="54" rx="16" fill="#F4EDFF"/><path d="M18 20h20v13H27l-6 6v-6h-3V20z" stroke="#8057FF" stroke-width="3" fill="none"/>
      <text x="76" y="22" class="h3">Feedback</text>
      <text x="76" y="50" class="muted">Collect votes and requests without sending users elsewhere.</text>
      <text x="378" y="35" class="body">→</text>
    </g>
  </g>

  <!-- Product system -->
  <g transform="translate(160 330)">
    <text x="0" y="0" class="small">• PRODUCT SYSTEM</text>
    <text x="0" y="80" class="h1">Everything buyers ask for</text>
    <text x="0" y="126" class="body">Give users one public place to see what is planned, what shipped, and where their feedback stands.</text>
    <g transform="translate(0 210)">
      <rect width="1280" height="590" class="soft"/>
      <line x1="426" y1="0" x2="426" y2="590" class="rule"/>
      <line x1="852" y1="0" x2="852" y2="590" class="rule"/>
      <g transform="translate(34 34)">
        <rect width="70" height="70" rx="18" fill="#EAFBF1"/><path d="M23 24l12-6 12 6 12-6v30l-12 6-12-6-12 6V24z" stroke="#22C55E" stroke-width="4" fill="none"/>
        <text x="95" y="30" class="h3">Public roadmap</text>
        <text x="95" y="64" class="body">Show planned, in-progress, and upcoming work.</text>
        <rect x="0" y="150" width="360" height="330" rx="10" class="panel" filter="url(#shadow)"/>
        <text x="28" y="198" class="h3">Roadmap</text>
        <text x="28" y="230" class="muted">See what is planned and in progress.</text>
        <line x1="28" y1="265" x2="332" y2="265" class="rule"/>
        <circle cx="35" cy="302" r="5" fill="#22C55E"/><text x="58" y="309" class="label">In Progress</text><rect x="302" y="287" width="30" height="30" rx="15" fill="#F2F5F7"/><text x="312" y="307" class="tiny">2</text>
        <circle cx="35" cy="360" r="5" fill="#237BFF"/><text x="58" y="367" class="label">Planned</text><rect x="302" y="345" width="30" height="30" rx="15" fill="#F2F5F7"/><text x="312" y="365" class="tiny">3</text>
        <circle cx="35" cy="418" r="5" fill="#B8C2CF"/><text x="58" y="425" class="label">Future</text><rect x="302" y="403" width="30" height="30" rx="15" fill="#F2F5F7"/><text x="312" y="423" class="tiny">2</text>
        <text x="102" y="536" class="label">View full roadmap →</text>
      </g>
      <g transform="translate(460 34)">
        <rect width="70" height="70" rx="18" fill="#EEF6FF"/><path d="M24 18h18l10 10v24H24V18z" stroke="#237BFF" stroke-width="4" fill="none"/>
        <text x="95" y="30" class="h3">Changelog</text>
        <text x="95" y="64" class="body">Turn shipped work into a clean release feed.</text>
        <rect x="0" y="150" width="360" height="330" rx="10" class="panel" filter="url(#shadow)"/>
        <text x="28" y="198" class="h3">Changelog</text>
        <text x="28" y="230" class="muted">Stay up to date with the latest changes.</text>
        <text x="28" y="292" class="label">v1.2.0</text><rect x="112" y="272" width="58" height="26" rx="13" fill="#DDFBE7"/><text x="127" y="290" class="tiny" fill="#16A34A">Latest</text>
        <text x="28" y="336" class="muted">• Added custom domain support</text>
        <text x="28" y="368" class="muted">• Public API beta</text>
        <text x="28" y="400" class="muted">• Improved dashboard performance</text>
        <line x1="28" y1="444" x2="332" y2="444" class="rule"/>
        <text x="105" y="536" class="label">View changelog →</text>
      </g>
      <g transform="translate(886 34)">
        <rect width="70" height="70" rx="18" fill="#F4EDFF"/><path d="M22 23h23v15H34l-8 8v-8h-4V23z" stroke="#8057FF" stroke-width="4" fill="none"/>
        <text x="95" y="30" class="h3">Feedback board</text>
        <text x="95" y="64" class="body">Collect requests, votes, and status changes.</text>
        <rect x="0" y="150" width="360" height="330" rx="10" class="panel" filter="url(#shadow)"/>
        <text x="28" y="198" class="h3">Feedback</text>
        <text x="28" y="230" class="muted">Vote and suggest what matters most.</text>
        <rect x="28" y="260" width="180" height="44" rx="8" class="soft"/><text x="55" y="288" class="muted">Search feedback...</text>
        <rect x="220" y="260" width="112" height="44" rx="8" class="soft"/><text x="247" y="288" class="label">Trending</text>
        <line x1="28" y1="330" x2="332" y2="330" class="rule"/><text x="54" y="365" class="label">128</text><text x="112" y="365" class="label">Add dark mode</text><rect x="250" y="345" width="68" height="26" rx="13" fill="#EFE2FF"/><text x="267" y="363" class="tiny">Planned</text>
