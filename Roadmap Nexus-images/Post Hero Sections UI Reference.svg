  <g transform="translate(160 2760)">
    <rect width="1280" height="500" class="soft"/>
    <line x1="360" y1="0" x2="360" y2="500" class="rule"/>
    <line x1="790" y1="0" x2="790" y2="500" class="rule"/>
    <text x="40" y="70" class="small">• OPEN-SOURCE CORE</text>
    <text x="40" y="150" class="h2">What you get for free</text>
    <text x="40" y="205" class="body">Everything needed to launch a public roadmap, changelog, and feedback board.</text>
    <text x="430" y="88" class="h3">Included in Free</text>
    <text x="430" y="155" class="label">✓ Public roadmap</text>
    <text x="430" y="220" class="label">✓ Public changelog</text>
    <text x="430" y="285" class="label">✓ Feedback board</text>
    <text x="430" y="350" class="label">✓ Basic docs</text>
    <text x="860" y="88" class="h3">Not in Free</text>
    <text x="860" y="155" class="label">– Multi-project workspace</text>
    <text x="860" y="220" class="label">– Premium themes</text>
    <text x="860" y="285" class="label">– Advanced integrations</text>
    <text x="860" y="350" class="label">– Enterprise features</text>

    <g transform="translate(0 650)">
      <text x="0" y="0" class="small">• BUILT TO EXTEND</text>
      <text x="0" y="80" class="h1">Familiar production stack</text>
      <rect y="145" width="1280" height="170" class="soft"/>
      <line x1="256" y1="145" x2="256" y2="315" class="rule"/><line x1="512" y1="145" x2="512" y2="315" class="rule"/><line x1="768" y1="145" x2="768" y2="315" class="rule"/><line x1="1024" y1="145" x2="1024" y2="315" class="rule"/>
      <text x="88" y="247" class="h3">Next.js</text><text x="328" y="247" class="h3">TypeScript</text><text x="604" y="247" class="h3">Tailwind</text><text x="874" y="247" class="h3">Prisma</text><text x="1112" y="247" class="h3">PostgreSQL</text>
    </g>

    <g transform="translate(0 1110)">
      <text x="0" y="0" class="small">• IMPLEMENTATION DOCS</text>
      <text x="0" y="80" class="h1">Docs that reduce setup risk</text>
      <text x="0" y="135" class="body">Clear setup paths for local development, deployment, environment variables, and extension points.</text>
      <rect x="430" y="-70" width="850" height="420" rx="14" class="panel" filter="url(#shadow)"/>
      <text x="470" y="-20" class="label">Roadmap Nexus Free Docs</text>
      <line x1="430" y1="28" x2="1280" y2="28" class="rule"/>
      <text x="470" y="92" class="muted">Introduction</text><text x="470" y="145" class="label">1  Install</text><text x="470" y="198" class="muted">2  Configure</text><text x="470" y="251" class="muted">3  Run Locally</text>
      <text x="725" y="105" class="h3">Install Roadmap Nexus Free</text>
      <rect x="725" y="150" width="500" height="74" rx="9" class="soft"/><text x="760" y="196" class="tiny">npx create-next-app@latest roadmap-nexus</text>
      <rect x="725" y="250" width="500" height="74" rx="9" class="soft"/><text x="760" y="296" class="tiny">npm install</text>
    </g>

    <g transform="translate(0 1640)">
      <text x="420" y="0" class="h2">Own the roadmap layer.</text>
      <text x="362" y="55" class="body">Start from a working product communication layer and customize it in your stack.</text>
      <rect x="455" y="115" width="170" height="58" rx="29" fill="#07111D"/><text x="493" y="152" fill="#fff" class="label">View Demo</text>
      <rect x="655" y="115" width="190" height="58" rx="29" class="soft"/><text x="697" y="152" class="label">Open GitHub</text>
      <text x="420" y="245" class="muted">MIT Licensed  •  Built with Next.js  •  © 2024 Roadmap Nexus Free</text>
    </g>
  </g>
</svg>
